apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: manav-app
  namespace: argocd
spec:
  project: manav-project
  source:
    repoURL: 'https://github.com/manav-makhija77/k8s-gitops-helm-argocd.git'
    targetRevision: main
    path: .
    helm:
      valueFiles:
      - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: manav
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
