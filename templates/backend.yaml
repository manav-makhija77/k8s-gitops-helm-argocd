apiVersion: apps/v1
kind: Deployment
metadata:
  name: be-deploy
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: be
  template:
    metadata:
      labels:
        app: be
    spec:
      containers:
      - name: be
        image: {{ .Values.backend.image }}
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: {{ .Values.backend.rootPassword }}
        ports:
        - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: be-svc
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: be
  ports:
  - port: 3306
    targetPort: 3306
