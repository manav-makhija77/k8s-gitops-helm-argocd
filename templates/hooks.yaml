apiVersion: batch/v1
kind: Job
metadata:
  name: db-schema-migration
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      containers:
      - name: migrate
        image: busybox:1.36
        command: ["sh", "-c", "echo 'Running DB Schema Migration before deploy...'; sleep 5; echo 'Migration Complete!'"]
      restartPolicy: Never
  backoffLimit: 1
---
apiVersion: batch/v1
kind: Job
metadata:
  name: post-deploy-smoke-test
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      containers:
      - name: smoke-test
        image: busybox:1.36
        command: ["sh", "-c", "echo 'Verifying frontend service endpoint...'; wget -qO- http://fe-svc:80 | head -n 5; echo 'Smoke Test Passed!'"]
      restartPolicy: Never
  backoffLimit: 1
