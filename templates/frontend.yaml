apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe-deploy
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: fe
  template:
    metadata:
      labels:
        app: fe
    spec:
      containers:
      - name: fe
        image: {{ .Values.frontend.image }}
        ports:
        - containerPort: 80
