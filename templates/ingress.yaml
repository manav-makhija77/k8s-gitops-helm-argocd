apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: manav-gateway-api
  namespace: {{ .Values.namespace }}
spec:
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fe-svc
            port:
              number: 80
